[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "page-vla"
version = "0.1.0"
description = "Patch-wise Anomaly-Gated Editing for frozen vision-language-action policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
